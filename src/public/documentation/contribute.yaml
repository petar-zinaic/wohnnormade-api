paths:
  /tenant/create:
    post:
      summary: Create a new tenant
      tags: [Contribute]
      security:
        - JWTAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTenantRequest"
      responses:
        200:
          description: Tenant created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantResponse"
        400:
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        401:
          description: Invalid or missing token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        500:
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /tenant/search:
    get:
      summary: Search tenants by name and optionally by date of birth
      tags: [Contribute]
      parameters:
        - name: q
          in: query
          required: true
          description: Search query for tenant name or surname
          schema:
            type: string
          example: "John Doe"
        - name: dateOfBirth
          in: query
          required: false
          description: Filter by date of birth (ISO 8601 format YYYY-MM-DD)
          schema:
            type: string
            format: date
          example: "1990-05-15"
      responses:
        200:
          description: List of matching tenants
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Tenant"
        400:
          description: Missing or invalid search query
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        500:
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /tenant:
    get:
      summary: Get all tenants
      tags: [Contribute]
      responses:
        200:
          description: List of all tenants
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Tenant"
        500:
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /tenant/{id}:
    get:
      summary: Get tenant by ID
      tags: [Contribute]
      parameters:
        - name: id
          in: path
          required: true
          description: Tenant ID
          schema:
            type: integer
          example: 1
      responses:
        200:
          description: Tenant details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tenant"
        400:
          description: ID is not a positive integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        404:
          description: Tenant not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        500:
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    put:
      summary: Update tenant by ID
      description: Only the landlord who reported the tenant can update it.
      tags: [Contribute]
      security:
        - JWTAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Tenant ID
          schema:
            type: integer
          example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTenantRequest"
      responses:
        200:
          description: Tenant updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantResponse"
        400:
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        401:
          description: Invalid or missing token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        403:
          description: Tenant was reported by another landlord
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        404:
          description: Tenant not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        500:
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    delete:
      summary: Delete tenant by ID
      description: Only the landlord who reported the tenant can delete it. Related message threads are deleted too.
      tags: [Contribute]
      security:
        - JWTAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Tenant ID
          schema:
            type: integer
          example: 1
      responses:
        200:
          description: Tenant deleted successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantResponse"
        401:
          description: Invalid or missing token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        403:
          description: Tenant was reported by another landlord
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        404:
          description: Tenant not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        500:
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    CreateTenantRequest:
      type: object
      required:
        - name
        - surname
        - violationType
        - description
        - city
        - country
      properties:
        name:
          type: string
          description: Tenant's name
          example: "John"
        surname:
          type: string
          description: Tenant's surname
          example: "Doe"
        dateOfBirth:
          type: string
          format: date
          description: Tenant's date of birth (optional)
          example: "1990-05-15"
        violationType:
          type: string
          description: Type of violation
          example: "Noise complaint"
        description:
          type: string
          description: Description of the issue
          example: "Loud music after 10 PM"
        city:
          type: string
          description: City where the issue occurred
          example: "New York"
        country:
          type: string
          description: Country where the issue occurred
          example: "USA"

    UpdateTenantRequest:
      type: object
      properties:
        name:
          type: string
          description: Tenant's name
          example: "John"
        surname:
          type: string
          description: Tenant's surname
          example: "Doe"
        dateOfBirth:
          type: string
          format: date
          description: Tenant's date of birth
          example: "1990-05-15"
        violationType:
          type: string
          description: Type of violation
          example: "Noise complaint"
        description:
          type: string
          description: Description of the issue
          example: "Loud music after 10 PM"
        city:
          type: string
          description: City where the issue occurred
          example: "New York"
        country:
          type: string
          description: Country where the issue occurred
          example: "USA"

    Tenant:
      type: object
      properties:
        id:
          type: integer
          description: Tenant's unique identifier
          example: 1
        name:
          type: string
          description: Tenant's name
          example: "John"
        surname:
          type: string
          description: Tenant's surname
          example: "Doe"
        dateOfBirth:
          type: string
          format: date-time
          description: Tenant's date of birth
          example: "1990-05-15T00:00:00.000Z"
        violationType:
          type: string
          description: Type of violation
          example: "Noise complaint"
        description:
          type: string
          description: Description of the issue
          example: "Loud music after 10 PM"
        city:
          type: string
          description: City where the issue occurred
          example: "New York"
        country:
          type: string
          description: Country where the issue occurred
          example: "USA"
        createdById:
          type: integer
          description: ID of the user who created this tenant record
          example: 1
        createdAt:
          type: string
          format: date-time
          description: Tenant creation timestamp
          example: "2024-01-01T00:00:00.000Z"
        updatedAt:
          type: string
          format: date-time
          description: Tenant last update timestamp
          example: "2024-01-01T00:00:00.000Z"

    TenantResponse:
      type: object
      properties:
        result:
          $ref: "#/components/schemas/Tenant"
        status:
          type: boolean
          default: true
        error:
          type: object
          default: {}
